name: Keep Render Awake 24/7

on:
  schedule:
    # Run every 10 minutes (cron syntax)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping WaterMate Backend Health Endpoint
        run: |
          echo "Pinging WaterMate Backend health endpoint..."
          curl -s -f -m 30 https://watermate.onrender.com/api/health || echo "Ping failed, will retry next run"
